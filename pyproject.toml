[project]
name = "transformer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Gregory Gundersen", email = "ggundersen@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "flax>=0.12.10",
    "jax>=0.12.0.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.8",
    "spacy>=3.8.16",
]

[project.scripts]
transformer = "transformer:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
